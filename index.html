<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mahamantra Jaap Counter</title>
<style>
body { margin: 0; padding: 16px; background: #12100e; color: #f8fafc; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; }
.box { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
.card { background: #1e1a16; border: 1px solid #2e2822; border-radius: 14px; padding: 14px; text-align: center; }
.mantra { color: #fde68a; font-weight: 600; line-height: 1.5; font-size: 1rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lbl { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
.val { font-size: 2.5rem; font-weight: 700; color: #f59e0b; margin-top: 4px; }
.row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; }
.bar { width: 100%; height: 14px; background: #090807; border-radius: 99px; overflow: hidden; position: relative; }
.fill { height: 100%; width: 0%; background: #10b981; }
.mark { position: absolute; top: 0; bottom: 0; width: 3px; background: #f59e0b; }
.log { margin-top: 8px; font-size: 0.82rem; color: #f59e0b; }
button { border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; }
.main { background: #f59e0b; color: #12100e; grid-column: span 2; }
.main.on { background: #ef4444; color: #fff; }
.sec { background: #2e2822; color: #f8fafc; }
.sgrp { text-align: left; font-size: 0.82rem; color: #94a3b8; margin-top: 6px; }
.sgrp div { display: flex; justify-content: space-between; color: #f8fafc; }
input[type=range] { width: 100%; accent-color: #f59e0b; }
</style>
</head>
<body>
<div class="box">
  <div class="card mantra">Hare Rama Hare Rama Rama Rama Hare Hare<br>Hare Krishna Hare Krishna Krishna Krishna Hare Hare</div>
  <div class="grid">
    <div class="card"><div class="lbl">Current Mala (108)</div><div class="val" id="bEl">0</div></div>
    <div class="card"><div class="lbl">Completed Malas</div><div class="val" id="mEl">0</div></div>
  </div>
  <div class="card">
    <div class="row"><span id="tEl">Chant: 0.0s | Pause: 0.0s</span><span id="sEl">Idle</span></div>
    <div class="bar"><div class="mark" id="mk" style="left:14%"></div><div class="fill" id="fl"></div></div>
    <div class="log" id="lg">Ready. Lock-screen media keep-alive enabled.</div>
  </div>
  <div class="grid">
    <button class="main" id="btn">Start Voice Counting</button>
    <button class="sec" id="tap">+1 Manual Tap</button>
    <button class="sec" id="cal">Calibrate Noise</button>
  </div>
  <div class="card">
    <div class="sgrp"><div><span>Voice Threshold</span><span id="v1">14</span></div><input type="range" id="r1" min="2" max="80" value="14"></div>
    <div class="sgrp"><div><span>Min Mantra (sec)</span><span id="v2">4.0s</span></div><input type="range" id="r2" min="2" max="8" step="0.1" value="4.0"></div>
    <div class="sgrp"><div><span>Max Cutoff (sec)</span><span id="v3">10.0s</span></div><input type="range" id="r3" min="6" max="15" step="0.5" value="10"></div>
    <div class="sgrp"><div><span>Breath Pause (sec)</span><span id="v4">1.3s</span></div><input type="range" id="r4" min="0.4" max="2.5" step="0.1" value="1.3"></div>
    <button class="sec" id="rst" style="width:100%;margin-top:10px;padding:10px;font-size:0.85rem">Reset Today</button>
  </div>
</div>
<script>
var key = "jaap_v2_" + new Date().toISOString().slice(0, 10);
var st = JSON.parse(localStorage.getItem(key)) || { b: 0, m: 0 };
if (typeof st.b !== "number" || isNaN(st.b)) st.b = 0;
if (typeof st.m !== "number" || isNaN(st.m)) st.m = 0;

var bEl = document.getElementById("bEl"), mEl = document.getElementById("mEl"), lg = document.getElementById("lg");
function updateMediaTitle() {
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "Bead " + st.b + " / 108 (Malas: " + st.m + ")",
      artist: "Mahamantra Jaap Counter"
    });
  }
}
function draw() {
  localStorage.setItem(key, JSON.stringify(st));
  bEl.textContent = st.b;
  mEl.textContent = st.m;
  updateMediaTitle();
}
draw();

function addOne() { st.b = st.b + 1; if (st.b >= 108) { st.b = 0; st.m = st.m + 1; } draw(); }

var r1 = document.getElementById("r1"), r2 = document.getElementById("r2"), r3 = document.getElementById("r3"), r4 = document.getElementById("r4");
function upd() {
  document.getElementById("v1").textContent = r1.value;
  document.getElementById("v2").textContent = Number(r2.value).toFixed(1) + "s";
  document.getElementById("v3").textContent = Number(r3.value).toFixed(1) + "s";
  document.getElementById("v4").textContent = Number(r4.value).toFixed(1) + "s";
  document.getElementById("mk").style.left = r1.value + "%";
}
r1.oninput = upd; r2.oninput = upd; r3.oninput = upd; r4.oninput = upd; upd();

document.getElementById("tap").onclick = function() { addOne(); lg.textContent = "Manual +1 added"; };
document.getElementById("rst").onclick = function() { if (confirm("Reset today?")) { st = { b: 0, m: 0 }; draw(); } };

// Silent 1-second WAV loop keeps iOS Safari active behind the Lock Screen
var keepAliveAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
keepAliveAudio.loop = true;

var run = false, stream = null, ctx = null, an = null, timer = null, wakeLock = null;
var ch = false, t0 = 0, tLast = 0, cal = false, smoothLv = 0, activeFrames = 0, totalFrames = 0;
var samples = new Array();
var btn = document.getElementById("btn"), sEl = document.getElementById("sEl"), tEl = document.getElementById("tEl"), fl = document.getElementById("fl");

async function keepAwake() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", function() { wakeLock = null; });
    }
  } catch (e) {}
}

btn.onclick = async function() {
  if (run) {
    run = false;
    clearInterval(timer);
    keepAliveAudio.pause();
    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    btn.textContent = "Start Voice Counting";
    btn.classList.remove("on");
    sEl.textContent = "Idle";
    fl.style.width = "0%";
    return;
  }
  try {
    await keepAliveAudio.play();
    updateMediaTitle();

    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    ctx = new AudioCtx();
    if (ctx.state !== "running") await ctx.resume();

    // Auto-resume if iOS marks AudioContext as interrupted on screen lock
    ctx.onstatechange = function() {
      if (run && ctx.state !== "running") {
        ctx.resume();
      }
    };

    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    var src = ctx.createMediaStreamSource(stream);
    var gain = ctx.createGain();
    gain.gain.value = 3.5;

    an = ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(gain);
    gain.connect(an);

    run = true;
    smoothLv = 0;
    await keepAwake();
    btn.textContent = "Stop Listening";
    btn.classList.add("on");
    sEl.textContent = "Listening";
    lg.textContent = "Active! Lock screen shows live bead count.";

    // setInterval runs continuously alongside active media playback even when locked
    timer = setInterval(function() {
      if (!run) return;
      if (ctx.state !== "running") ctx.resume();

      var d = new Uint8Array(an.frequencyBinCount);
      an.getByteTimeDomainData(d);
      var sq = 0;
      for (var i = 0; i < d.length; i++) {
        var n = (d[i] - 128) / 128;
        sq += n * n;
      }
      var rawLv = Math.min(100, Math.round(Math.sqrt(sq / d.length) * 800));
      if (rawLv > smoothLv) {
        smoothLv = rawLv;
      } else {
        smoothLv = smoothLv * 0.85;
      }
      var lv = Math.round(smoothLv);

      if (document.visibilityState === "visible") {
        fl.style.width = lv + "%";
      }
      if (cal) samples.push(lv);

      var th = Number(r1.value), mn = Number(r2.value), mx = Number(r3.value), ps = Number(r4.value);
      var now = Date.now();

      if (lv >= th) {
        if (!ch) { ch = true; t0 = now; activeFrames = 0; totalFrames = 0; }
        tLast = now;
        activeFrames++;
      }

      if (ch) {
        totalFrames++;
        var gap = (now - tLast) / 1000;
        var dur = (tLast - t0) / 1000;
        if (document.visibilityState === "visible") {
          sEl.textContent = dur > mx ? "Too Long" : "Chanting...";
          tEl.textContent = "Chant: " + dur.toFixed(1) + "s | Pause: " + gap.toFixed(1) + "s";
        }
        if (gap >= ps) {
          var density = activeFrames / Math.max(1, totalFrames);
          if (dur >= mn && dur <= mx && density >= 0.45) {
            addOne();
            lg.textContent = "Counted +1 (" + dur.toFixed(1) + "s)";
          } else if (density < 0.45) {
            lg.textContent = "Ignored background noise";
          } else {
            lg.textContent = "Skipped (" + dur.toFixed(1) + "s)";
          }
          ch = false;
          if (document.visibilityState === "visible") {
            sEl.textContent = "Listening";
            tEl.textContent = "Chant: 0.0s | Pause: 0.0s";
          }
        }
      }
    }, 50);
  } catch (e) {
    alert("Mic error: " + e.message);
  }
};

document.getElementById("cal").onclick = function() {
  if (!run) return alert("Tap Start Voice Counting first.");
  samples = new Array();
  cal = true;
  sEl.textContent = "Calibrating...";
  setTimeout(function() {
    cal = false;
    if (samples.length > 0) {
      var peak = Math.max.apply(null, samples);
      r1.value = Math.min(75, Math.max(8, peak + 4));
      upd();
